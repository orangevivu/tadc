<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Glowing shadow drop effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5e7e" />
      <stop offset="100%" stop-color="#ff2a55" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#008bff" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff066" />
      <stop offset="100%" stop-color="#ffd700" />
    </linearGradient>
  </defs>

  <!-- Deep dark ring boundary -->
  <circle cx="32" cy="32" r="30" fill="#07030f" stroke="#ff2a55" stroke-width="2" />
  <circle cx="32" cy="32" r="27" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3,3" opacity="0.8" />

  <!-- Pomni's Jester Hat SVG shape -->
  <g filter="url(#glow)">
    <!-- Left side of hat (cyan/blue) -->
    <path d="M 32 38 C 26 38 18 32 14 24 C 18 20 25 24 29 28 C 31 30 32 34 32 38 Z" fill="url(#blueGrad)" />
    <!-- Right side of hat (magenta/red) -->
    <path d="M 32 38 C 38 38 46 32 50 24 C 46 20 39 24 35 28 C 33 30 32 34 32 38 Z" fill="url(#redGrad)" />
    
    <!-- Left bell (gold) -->
    <circle cx="14" cy="24" r="3.5" fill="url(#yellowGrad)" stroke="#07030f" stroke-width="0.75" />
    <!-- Right bell (gold) -->
    <circle cx="50" cy="24" r="3.5" fill="url(#yellowGrad)" stroke="#07030f" stroke-width="0.75" />
    
    <!-- Hat band / brim (white/yellow) -->
    <path d="M 22 38 C 26 39 38 39 42 38 C 41 41 23 41 22 38 Z" fill="#ffffff" />
    
    <!-- Jester base hair/cheek hint (cyan/red highlights) -->
    <circle cx="32" cy="34" r="4.5" fill="url(#yellowGrad)" />
  </g>
</svg>
